"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.ssh_hostname}\
$directory\
$git_branch\
$time\
$character"""

[custom.ssh_hostname]
command = 'hostname'
when = 'test -n "$SSH_CONNECTION"'
style = "bold red"
format = '[@$output ]($style)'

[directory]
style = "bold yellow"
format = "[$path]($style)"
truncate_to_repo = false
truncation_length = 1
truncation_symbol = ""

[git_branch]
symbol = "git"
style = "cyan"
format = '[ $symbol:$branch]($style)'
truncation_length = 10
truncation_symbol = ""

[time]
disabled = false
time_format = "%R"
style = "base03"
format = '[ $time]($style)'

[character]
disabled = false
success_symbol = '[ >](bold green) '
error_symbol = '[ >](bold red) '
vimcmd_symbol = '[ <](bold green) '
vimcmd_replace_one_symbol = '[ <](bold purple) '
vimcmd_replace_symbol = '[ <](bold purple) '
vimcmd_visual_symbol = '[ <](bold yellow) '

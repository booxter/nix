[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "check-commit-message"
version = "0.1.0"
description = "Validate the global Git commit message format"
requires-python = ">=3.11"

[project.scripts]
check-commit-message = "check_commit_message.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=check_commit_message --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/check_commit_message"]
strict = true

[tool.ruff]
line-length = 100

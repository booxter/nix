[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-tools"
version = "0.1.0"
description = "Typed helpers for local Codex account automation"
requires-python = ">=3.11"
dependencies = ["openai", "pydantic"]

[project.scripts]
codex-rate-limit-reset-credits = "codex_tools.cli:reset_credits_main"
codex-sketchybar = "codex_tools.sketchybar_personal:main"
codex-usage-status = "codex_tools.cli:usage_main"
codex-warmer = "codex_tools.cli:warmer_main"
codex-work-sketchybar = "codex_tools.sketchybar_work:main"
codex-work-usage-status = "codex_tools.cli:work_usage_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=codex_tools --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/codex_tools"]
strict = true

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mcp-init"
version = "0.1.0"
description = "Authenticate configured Codex HTTP MCP servers"
requires-python = ">=3.11"

[project.scripts]
codex-mcp-init = "codex_mcp_init.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=codex_mcp_init --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/codex_mcp_init"]
strict = true

[tool.ruff]
line-length = 100

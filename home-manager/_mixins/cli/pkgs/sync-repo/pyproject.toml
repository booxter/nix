[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-repo"
version = "0.1.0"
description = "Synchronize personal Git repositories on demand"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sync-repo = "sync_repo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sync_repo --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/sync_repo"]
strict = true

[tool.ruff]
line-length = 100

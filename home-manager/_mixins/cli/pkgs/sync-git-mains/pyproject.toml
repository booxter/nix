[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-git-mains"
version = "0.1.0"
description = "Fast-forward local Git main branches from origin"
requires-python = ">=3.11"
dependencies = ["dulwich"]

[project.scripts]
sync-git-mains = "sync_git_mains.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sync_git_mains --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/sync_git_mains"]
strict = true

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nr"
version = "0.1.0"
description = "Run nixpkgs-review with fleet builder defaults"
requires-python = ">=3.11"

[project.scripts]
nr = "nr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=nr --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/nr"]
strict = true

[tool.ruff]
line-length = 100

name: Auto update flake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Nix environment
        uses: ./.github/actions/prepare-nix-env

      - name: Save current flake lock
        run: cp flake.lock "$RUNNER_TEMP/flake.lock.before"

      - name: Update flake inputs
        run: nix flake update

      - name: Generate pull request body
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          nix run .#flake-input-update-summary -- \
            "$RUNNER_TEMP/flake.lock.before" \
            flake.lock \
            --trigger "$TRIGGER" \
            --output "$RUNNER_TEMP/flake-update-body.md"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CI_PR_TOKEN }}
          commit-message: "flake: update inputs"
          title: "flake: update inputs"
          body-path: ${{ runner.temp }}/flake-update-body.md
          branch: ci/flake-update
          delete-branch: true
          add-paths: |
            flake.lock

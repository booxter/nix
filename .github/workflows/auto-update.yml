name: Auto update flake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  update:
    runs-on: nix-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Save current flake lock
        run: cp flake.lock "$RUNNER_TEMP/flake.lock.before"

      - name: Update flake inputs
        run: nix flake update

      - name: Generate pull request body
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          nix run .#flake-input-update-summary -- \
            "$RUNNER_TEMP/flake.lock.before" \
            flake.lock \
            --trigger "$TRIGGER" \
            --output "$RUNNER_TEMP/flake-update-body.md"

      - name: Create update token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: "flake: update inputs"
          title: "flake: update inputs"
          body-path: ${{ runner.temp }}/flake-update-body.md
          branch: ci/flake-update
          delete-branch: true
          add-paths: |
            flake.lock

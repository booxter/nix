name: Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read
  pull-requests: read

jobs:
  check:
    name: Regular checks (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            extra_conf: |
              extra-experimental-features = auto-allocate-uids cgroups
              auto-allocate-uids = true
            nix_config: system-features = benchmark big-parallel kvm nixos-test uid-range
          - os: macos-26
            system: aarch64-darwin
            extra_conf: ""
            nix_config: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      NIX_CONFIG: ${{ matrix.nix_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: matrix.system == 'x86_64-linux'
        uses: ./.github/actions/free-disk-space

      - name: Prepare Nix environment
        uses: ./.github/actions/prepare-nix-env
        with:
          extra-conf: ${{ matrix.extra_conf }}

      - name: Run regular checks
        run: make check

  check-success:
    name: Regular checks
    if: ${{ always() }}
    needs:
      - check
    runs-on: ubuntu-slim
    steps:
      - name: Check regular check results
        run: |
          set -euo pipefail

          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "Regular check matrix result: ${{ needs.check.result }}"
            exit 1
          fi
          echo "All regular checks passed."

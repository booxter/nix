name: Prepare Nix environment
description: Checkout the repo, install Determinate Nix, and configure FlakeHub Cache.
inputs:
  extra-conf:
    description: Additional nix.conf entries passed to the Nix installer.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
      with:
        extra-conf: |
          trusted-users = root runner
          allowed-users = root runner
          ${{ runner.os == 'macOS' && 'sandbox = relaxed' || '' }}
          extra-substituters = https://cache.saumon.network/proxmox-nixos
          extra-trusted-public-keys = proxmox-nixos:D9RYSWpQQC/msZUWphOY2I5RLH5Dd6yQcaHIuug7dWM=
          ${{ inputs.extra-conf }}

    - name: Setup FlakeHub Cache
      uses: DeterminateSystems/flakehub-cache-action@146f476c94460cb634f9ade79470fcbc3f7e5b36 # v1

    - name: Verify required Nix daemon settings
      shell: bash
      run: |
        set -euo pipefail

        required_substituters=(
          "https://cache.saumon.network/proxmox-nixos"
        )
        required_public_keys=(
          "proxmox-nixos:D9RYSWpQQC/msZUWphOY2I5RLH5Dd6yQcaHIuug7dWM="
        )

        substituters="$(nix config show substituters)"
        trusted_keys="$(nix config show trusted-public-keys)"

        for substituter in "${required_substituters[@]}"; do
          if ! grep -Fq "${substituter}" <<< "${substituters}"; then
            echo "Missing required substituter: ${substituter}"
            echo "Configured substituters: ${substituters}"
            exit 1
          fi
        done

        for key in "${required_public_keys[@]}"; do
          if ! grep -Fq "${key}" <<< "${trusted_keys}"; then
            echo "Missing required trusted key: ${key}"
            echo "Configured trusted-public-keys: ${trusted_keys}"
            exit 1
          fi
        done

    - name: Dump nix daemon config
      shell: bash
      run: |
        set -euo pipefail
        for conf in /etc/nix/*.conf; do
          [ -f "${conf}" ] || continue
          echo "----- ${conf} -----"
          cat "${conf}"
        done

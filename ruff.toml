target-version = "py313"
line-length = 100
# Package checks run from their own source roots, so disable working-directory discovery.
src = []

[lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "EXE",
  "F",
  "FLY",
  "FURB",
  "G",
  "I",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "PLE",
  "PLW",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  # Enable Bandit's high-signal rule groups while deferring the noisy rules below.
  "S1",
  "S2",
  "S3",
  "S5",
  "S6",
  "S7",
  "SIM",
  "T10",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Assertions, credential-like literals, temporary paths, and general URL opening need
  # test/source scoping before they can produce useful findings across the repository.
  "S101",
  "S105",
  "S106",
  "S108",
  "S310",
  # Shell-free process execution and executable lookup need a separate command-runner audit.
  "S603",
  "S606",
  "S607",
]

[lint.mccabe]
max-complexity = 15

[lint.isort]
# Do not reclassify local imports when Ruff happens to run inside a package directory.
detect-same-package = false

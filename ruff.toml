target-version = "py313"
line-length = 100
# Package checks run from their own source roots, so disable working-directory discovery.
src = []

[lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "UP", "W"]

[lint.isort]
# Do not reclassify local imports when Ruff happens to run inside a package directory.
detect-same-package = false

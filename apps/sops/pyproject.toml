[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sops-tools"
version = "0.1.0"
description = "Repository-aware helpers for managing host secrets with SOPS"
requires-python = ">=3.11"
dependencies = ["PyYAML"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sops_tools --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.mypy]
files = ["src/sops_tools"]
strict = true


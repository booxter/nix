[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sops-tools"
version = "0.1.0"
description = "Repository-aware helpers for managing host secrets with SOPS"
requires-python = ">=3.11"
dependencies = ["PyYAML"]

[project.scripts]
sops-cat = "sops_tools.cli:cat_main"
sops-copy = "sops_tools.cli:copy_main"
sops-edit = "sops_tools.cli:edit_main"
sops-set = "sops_tools.cli:set_main"
sops-update = "sops_tools.cli:update_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=sops_tools --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.mypy]
files = ["src/sops_tools"]
strict = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vikunja-provision"
version = "0.1.0"
description = "Reconcile Vikunja bots, project access, and MCP tokens"
requires-python = ">=3.13"
dependencies = ["atomic-file-writes", "authlib", "httpx2", "pydantic", "sops-tools"]

[project.scripts]
vikunja-provision = "vikunja_provision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vikunja_provision = ["py.typed"]

[tool.mypy]
files = ["src/vikunja_provision"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=vikunja_provision --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nixpkgs-cache-warmer"
version = "0.1.0"
description = "Build maintained nixpkgs packages for the local store watcher"
requires-python = ">=3.11"
dependencies = ["atomic-file-writes", "pydantic"]

[project.scripts]
nixpkgs-cache-warmer = "nixpkgs_cache_warmer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=nixpkgs_cache_warmer --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/nixpkgs_cache_warmer"]
strict = true

[tool.ruff]
line-length = 100

[package]
name = "fleet-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
gix = { version = "0.83.0", default-features = false, features = ["revision", "sha1"] }
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"

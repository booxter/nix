[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "get-ff-cookie"
version = "0.1.0"
description = "Export Firefox cookies in Netscape format"
requires-python = ">=3.11"

[project.scripts]
get-ff-cookie = "get_ff_cookie.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=get_ff_cookie --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/get_ff_cookie"]
strict = true

[tool.ruff]
line-length = 100

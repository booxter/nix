[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "search-stack-probes"
version = "0.1.0"
description = "Collect org search-stack dependency metrics"
requires-python = ">=3.11"
dependencies = ["httpx", "prometheus-client", "pydantic"]

[project.scripts]
searchless-ngx-metrics = "search_stack_probes.cli:searchless_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
search_stack_probes = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=search_stack_probes --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/search_stack_probes"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

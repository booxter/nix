[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "open-webui-tool-acl-reconcile"
version = "0.1.0"
description = "Reconcile an Open WebUI tool server ACL with a group"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic"]

[project.scripts]
open-webui-tool-acl-reconcile = "open_webui_tool_acl_reconcile.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=open_webui_tool_acl_reconcile --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/open_webui_tool_acl_reconcile"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-storage-observability"
version = "0.2.0"
description = "Typed Prometheus storage collectors for beast"
requires-python = ">=3.11"
dependencies = ["atomic-file-writes", "prometheus-client", "pydantic"]

[project.scripts]
beast-hba-metrics = "beast_storage_observability.cli:hba_main"
beast-disk-bay-metrics = "beast_storage_observability.cli:disk_bay_main"
beast-md-metrics = "beast_storage_observability.cli:md_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beast_storage_observability = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=beast_storage_observability --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.mypy]
files = ["src/beast_storage_observability"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

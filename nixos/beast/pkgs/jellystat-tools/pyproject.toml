[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jellystat-tools"
version = "0.1.0"
description = "Bootstrap and back up the Beast Jellystat service"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic"]

[project.scripts]
jellystat-bootstrap = "jellystat_tools.cli:bootstrap_main"
jellystat-built-in-backup = "jellystat_tools.cli:backup_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jellystat_tools = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=jellystat_tools --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/jellystat_tools"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

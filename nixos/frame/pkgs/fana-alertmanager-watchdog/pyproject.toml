[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fana-alertmanager-watchdog"
version = "0.1.0"
description = "Watch fana Alertmanager readiness and send direct Telegram notifications"
requires-python = ">=3.11"
dependencies = ["atomic-file-writes", "python-telegram-bot"]

[project.scripts]
fana-alertmanager-watchdog = "fana_alertmanager_watchdog.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=fana_alertmanager_watchdog --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/fana_alertmanager_watchdog"]
strict = true

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pinepods-tools"
version = "0.1.0"
description = "Bootstrap and back up the srvarr PinePods service"
requires-python = ">=3.11"
dependencies = ["httpx", "psycopg", "pydantic"]

[project.scripts]
pinepods-bootstrap-admin = "pinepods_tools.cli:bootstrap_main"
pinepods-native-backup = "pinepods_tools.cli:backup_main"
pinepods-set-database-password = "pinepods_tools.cli:database_password_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinepods_tools = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=pinepods_tools --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.mypy]
files = ["src/pinepods_tools"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

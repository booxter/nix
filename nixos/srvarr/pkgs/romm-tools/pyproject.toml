[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "romm-tools"
version = "0.1.0"
description = "Host integration tools for the srvarr RomM service"
requires-python = ">=3.11"
dependencies = ["mariadb", "podman", "pydantic", "requests", "sqlalchemy"]

[project.scripts]
romm-db-init = "romm_tools.database:main"
romm-prepare-assets = "romm_tools.assets:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
romm_tools = ["py.typed"]
"romm_tools.data" = ["*.js"]

[tool.pytest.ini_options]
addopts = "-q --cov=romm_tools --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
files = ["src/romm_tools"]
strict = true

[tool.ruff]
line-length = 100

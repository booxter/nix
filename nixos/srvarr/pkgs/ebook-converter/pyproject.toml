[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "srvarr-ebook-converter"
version = "0.1.0"
description = "Convert library MOBI and AZW3 files to EPUB"
requires-python = ">=3.11"
dependencies = ["atomic-file-writes", "prometheus-client", "pydantic"]

[project.scripts]
ebook-converter = "srvarr_ebook_converter.app:main"
shelfmark-ebook-converter-hook = "srvarr_ebook_converter.app:shelfmark_hook_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=srvarr_ebook_converter --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.mypy]
files = ["src/srvarr_ebook_converter"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

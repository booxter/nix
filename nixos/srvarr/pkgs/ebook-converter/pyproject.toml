[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "srvarr-ebook-converter"
version = "0.1.0"
description = "Convert library MOBI and AZW3 files to EPUB"
requires-python = ">=3.11"

[project.scripts]
ebook-converter = "srvarr_ebook_converter.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=srvarr_ebook_converter --cov-report=term-missing --cov-fail-under=65"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "myanonamouse-ip-updater"
version = "0.1.0"
description = "Update the MyAnonamouse dynamic seedbox address"
requires-python = ">=3.11"
dependencies = ["atomic-file-writes", "pydantic"]

[project.scripts]
myanonamouse-ip-update = "myanonamouse_ip_updater.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myanonamouse_ip_updater = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=myanonamouse_ip_updater --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/myanonamouse_ip_updater"]
strict = true

[tool.ruff]
line-length = 100

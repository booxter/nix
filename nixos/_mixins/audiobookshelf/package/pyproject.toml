[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobookshelf-tools"
version = "0.1.0"
description = "Reconcile Audiobookshelf settings and libraries"
requires-python = ">=3.13"
dependencies = ["httpx", "pydantic", "pystemd"]

[project.scripts]
audiobookshelf-reconcile = "audiobookshelf_tools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiobookshelf_tools = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=audiobookshelf_tools --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/audiobookshelf_tools"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

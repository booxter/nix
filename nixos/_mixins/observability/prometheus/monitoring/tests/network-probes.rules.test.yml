rule_files:
  - ../rules/network-probes.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'probe_success{instance="beast:gateway",job="blackbox-icmp",probe="gateway",probe_family="network",probe_protocol="icmp",probe_role="reachability",probe_title="Gateway 192.168.0.1",source="beast",target="192.168.0.1"}'
        values: "1x6"
    alert_rule_test:
      - eval_time: 2m
        alertname: NetworkProbeDown

  - interval: 30s
    input_series:
      - series: 'probe_success{instance="fana:gateway-dns",job="blackbox-tcp",probe="gateway-dns",probe_family="network",probe_protocol="tcp",probe_role="reachability",probe_title="Gateway DNS 192.168.0.1:53",source="fana",target="192.168.0.1:53"}'
        values: "0x4 1x2"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: NetworkProbeDown
      - eval_time: 2m
        alertname: NetworkProbeDown
        exp_alerts:
          - exp_labels:
              alertname: NetworkProbeDown
              category: network
              instance: fana:gateway-dns
              job: blackbox-tcp
              probe: gateway-dns
              probe_family: network
              probe_protocol: tcp
              probe_role: reachability
              probe_title: "Gateway DNS 192.168.0.1:53"
              severity: warning
              source: fana
              target: "192.168.0.1:53"
            exp_annotations:
              summary: "Network probe down: fana -> gateway-dns"
              description: "The tcp probe from fana to Gateway DNS 192.168.0.1:53 (192.168.0.1:53) has been failing for 2 minutes."

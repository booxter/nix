rule_files:
  - ../rules/service-probes.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'probe_success{instance="jellyfin",job="blackbox-arr",probe_family="service",probe_protocol="http",probe_role="frontdoor",probe_title="Front door",scope="external",service="jellyfin",service_title="Jellyfin",target="https://jf.ihar.dev/web/"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 5m
        alertname: ServiceProbeDown

  - interval: 30s
    input_series:
      - series: 'probe_success{instance="paperless-gpt",job="blackbox-backend",probe_family="service",probe_protocol="http",probe_role="backend",probe_title="Backend",scope="backend",service="paperless-gpt",service_title="Paperless GPT",target="https://paperless-gpt.home.arpa:9443/api/version"}'
        values: "0x10 1x2"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: ServiceProbeDown
      - eval_time: 5m
        alertname: ServiceProbeDown
        exp_alerts:
          - exp_labels:
              alertname: ServiceProbeDown
              category: service
              instance: paperless-gpt
              job: blackbox-backend
              probe_family: service
              probe_protocol: http
              probe_role: backend
              probe_title: Backend
              scope: backend
              service: paperless-gpt
              service_title: Paperless GPT
              severity: warning
              target: "https://paperless-gpt.home.arpa:9443/api/version"
            exp_annotations:
              summary: "Backend probe down: Paperless GPT"
              description: "The Backend probe for Paperless GPT (https://paperless-gpt.home.arpa:9443/api/version) has been failing for 5 minutes."

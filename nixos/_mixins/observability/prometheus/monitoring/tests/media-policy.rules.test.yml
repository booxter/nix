rule_files:
  - ../rules/media-policy.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'host_observability_adaptive_upload_active_external_media_streams{instance="srvarr"}'
        values: "1x22"
      - series: 'host_observability_adaptive_upload_missing_external_media_bitrate_sessions{instance="srvarr"}'
        values: "0x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: AdaptiveUploadMissingRemoteBitrateData

  - interval: 30s
    input_series:
      - series: 'host_observability_adaptive_upload_active_external_media_streams{instance="srvarr"}'
        values: "1x20 0x2"
      - series: 'host_observability_adaptive_upload_missing_external_media_bitrate_sessions{instance="srvarr"}'
        values: "2x20 0x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: AdaptiveUploadMissingRemoteBitrateData
      - eval_time: 10m
        alertname: AdaptiveUploadMissingRemoteBitrateData
        exp_alerts:
          - exp_labels:
              alertname: AdaptiveUploadMissingRemoteBitrateData
              category: media
              instance: srvarr
              severity: warning
            exp_annotations:
              summary: "Adaptive upload missing remote bitrate data on srvarr"
              description: "The adaptive upload controller on srvarr is seeing active external Jellyfin streams with missing bitrate data for at least 10 minutes."

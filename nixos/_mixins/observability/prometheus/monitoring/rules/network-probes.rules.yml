groups:
  - name: network-probes
    interval: 30s
    rules:
      - alert: NetworkProbeDown
        expr: probe_success{probe_family="network"} < 1
        for: 2m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "Network probe down: {{ $labels.source }} -> {{ $labels.probe }}"
          description: "The {{ $labels.probe_protocol }} probe from {{ $labels.source }} to {{ $labels.probe_title }} ({{ $labels.target }}) has been failing for 2 minutes."

groups:
  - name: service-probes
    interval: 30s
    rules:
      - alert: ServiceProbeDown
        expr: probe_success{probe_family="service"} < 1
        for: 5m
        labels:
          severity: warning
          category: service
        annotations:
          summary: "{{ $labels.probe_title }} probe down: {{ $labels.service_title }}"
          description: "The {{ $labels.probe_title }} probe for {{ $labels.service_title }} ({{ $labels.target }}) has been failing for 5 minutes."

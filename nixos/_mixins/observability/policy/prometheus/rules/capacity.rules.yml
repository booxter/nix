groups:
  - name: fleet-capacity-policy
    interval: 30s
    rules:
      - alert: NodeCpuUsageHigh
        expr: |
          100 - (
            avg by(instance, job) (
              rate(node_cpu_seconds_total{scrape_profile="node",host_laptop="false",host_builder="false",mode="idle"}[5m])
            ) * 100
          ) > 80
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Node CPU usage high on {{ $labels.instance }}"
          description: "{{ $labels.instance }} CPU busy has been above 80% for 5 minutes."
      - alert: NodeCpuUsageCritical
        expr: |
          100 - (
            avg by(instance, job) (
              rate(node_cpu_seconds_total{scrape_profile="node",host_laptop="false",host_builder="false",mode="idle"}[5m])
            ) * 100
          ) > 90
        for: 5m
        labels:
          severity: critical
          category: capacity
        annotations:
          summary: "Node CPU usage critical on {{ $labels.instance }}"
          description: "{{ $labels.instance }} CPU busy has been above 90% for 5 minutes."
      - alert: NodeMemoryUsageHigh
        expr: |
          max by(instance, job) (
            100 * (
              1 - (
                node_memory_MemAvailable_bytes{scrape_profile="node",host_laptop="false"}
                / node_memory_MemTotal_bytes{scrape_profile="node",host_laptop="false"}
              )
            )
          ) > 80
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Node memory usage high on {{ $labels.instance }}"
          description: "{{ $labels.instance }} memory usage has been above 80% for 5 minutes."
      - alert: NodeMemoryUsageCritical
        expr: |
          max by(instance, job) (
            100 * (
              1 - (
                node_memory_MemAvailable_bytes{scrape_profile="node",host_laptop="false"}
                / node_memory_MemTotal_bytes{scrape_profile="node",host_laptop="false"}
              )
            )
          ) > 90
        for: 5m
        labels:
          severity: critical
          category: capacity
        annotations:
          summary: "Node memory usage critical on {{ $labels.instance }}"
          description: "{{ $labels.instance }} memory usage has been above 90% for 5 minutes."

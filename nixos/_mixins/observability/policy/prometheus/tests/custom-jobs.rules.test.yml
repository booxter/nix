rule_files:
  - ../rules/custom-jobs.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'host_observability_transmission_exporter_ok{instance="srvarr"}'
        values: "1x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: TransmissionCollectorFailed

  - interval: 30s
    input_series:
      - series: 'host_observability_transmission_exporter_ok{instance="srvarr"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: TransmissionCollectorFailed
      - eval_time: 10m
        alertname: TransmissionCollectorFailed
        exp_alerts:
          - exp_labels:
              alertname: TransmissionCollectorFailed
              category: automation
              instance: srvarr
              severity: warning
            exp_annotations:
              summary: "Transmission collector failed on srvarr"
              description: "The Transmission metrics collector on srvarr has been reporting unsuccessful iterations for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_transmission_exporter_last_success_timestamp_seconds{instance="srvarr"}'
        values: "0x31"
    alert_rule_test:
      - eval_time: 15m
        alertname: TransmissionCollectorStale
      - eval_time: 15m30s
        alertname: TransmissionCollectorStale
        exp_alerts:
          - exp_labels:
              alertname: TransmissionCollectorStale
              category: automation
              instance: srvarr
              severity: warning
            exp_annotations:
              summary: "Transmission collector stale on srvarr"
              description: "The Transmission metrics collector on srvarr has not completed a successful iteration for more than 10 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_adaptive_upload_exporter_ok{instance="srvarr"}'
        values: "1x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: AdaptiveUploadPolicyExporterFailed

  - interval: 30s
    input_series:
      - series: 'host_observability_adaptive_upload_exporter_ok{instance="srvarr"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: AdaptiveUploadPolicyExporterFailed
      - eval_time: 10m
        alertname: AdaptiveUploadPolicyExporterFailed
        exp_alerts:
          - exp_labels:
              alertname: AdaptiveUploadPolicyExporterFailed
              category: automation
              instance: srvarr
              severity: warning
            exp_annotations:
              summary: "Adaptive upload controller exporter failed on srvarr"
              description: "The adaptive upload controller on srvarr has been unable to fetch Jellyfin exporter state successfully for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="srvarr",file="/var/lib/prometheus-node-exporter-textfile/adaptive-upload-policy.prom"}'
        values: "0x31"
    alert_rule_test:
      - eval_time: 15m
        alertname: AdaptiveUploadPolicyMetricsStale
      - eval_time: 15m30s
        alertname: AdaptiveUploadPolicyMetricsStale
        exp_alerts:
          - exp_labels:
              alertname: AdaptiveUploadPolicyMetricsStale
              category: automation
              file: /var/lib/prometheus-node-exporter-textfile/adaptive-upload-policy.prom
              instance: srvarr
              severity: warning
            exp_annotations:
              summary: "Adaptive upload metrics stale on srvarr"
              description: "The adaptive upload controller metrics file on srvarr has not been refreshed for more than 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{instance="srvarr",job="node-mtls",name="arr-post-processor-lidarr.service",state="active"}'
        values: "0x10 1x2"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: LidarrPostProcessorServiceDown
      - eval_time: 5m
        alertname: LidarrPostProcessorServiceDown
        exp_alerts:
          - exp_labels:
              alertname: LidarrPostProcessorServiceDown
              category: media
              instance: srvarr
              job: node-mtls
              name: arr-post-processor-lidarr.service
              severity: warning
              state: active
            exp_annotations:
              summary: "Lidarr post-processor service down on srvarr"
              description: "The Lidarr post-processor service on srvarr has not been active for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{instance="srvarr",job="node-mtls",name="houndarr-status-collector.timer",state="active"}'
        values: "0x10 1x2"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: HoundarrStatusCollectorTimerDown
      - eval_time: 5m
        alertname: HoundarrStatusCollectorTimerDown
        exp_alerts:
          - exp_labels:
              alertname: HoundarrStatusCollectorTimerDown
              category: media
              instance: srvarr
              job: node-mtls
              name: houndarr-status-collector.timer
              severity: warning
              state: active
            exp_annotations:
              summary: "Houndarr status collector timer down on srvarr"
              description: "The Houndarr operational status collector timer on srvarr has not been active for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_houndarr_status_ok{instance="srvarr",job="node-mtls"}'
        values: "0x10 1x2"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: HoundarrStatusCollectionFailed
      - eval_time: 5m
        alertname: HoundarrStatusCollectionFailed
        exp_alerts:
          - exp_labels:
              alertname: HoundarrStatusCollectionFailed
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Houndarr status collection failed on srvarr"
              description: "The Houndarr operational status endpoint has been unavailable or invalid for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="srvarr",job="node-mtls",file="/var/lib/prometheus-node-exporter-textfile/houndarr-status.prom"}'
        values: "0x31"
    alert_rule_test:
      - eval_time: 15m
        alertname: HoundarrStatusMetricsStale
      - eval_time: 15m30s
        alertname: HoundarrStatusMetricsStale
        exp_alerts:
          - exp_labels:
              alertname: HoundarrStatusMetricsStale
              category: media
              file: /var/lib/prometheus-node-exporter-textfile/houndarr-status.prom
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Houndarr status metrics stale on srvarr"
              description: "The Houndarr operational status metrics on srvarr have not been refreshed for more than 10 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_houndarr_active_error_instances{instance="srvarr",job="node-mtls"}'
        values: "1x20 0x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: HoundarrInstanceActiveError
      - eval_time: 10m
        alertname: HoundarrInstanceActiveError
        exp_alerts:
          - exp_labels:
              alertname: HoundarrInstanceActiveError
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Houndarr has failing Arr instances on srvarr"
              description: "At least one enabled Houndarr Arr instance has reported an active scheduler error for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_lidarr_post_processor_ok{instance="srvarr",job="node-mtls"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: LidarrPostProcessorIterationFailed
      - eval_time: 10m
        alertname: LidarrPostProcessorIterationFailed
        exp_alerts:
          - exp_labels:
              alertname: LidarrPostProcessorIterationFailed
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Lidarr post-processor failing on srvarr"
              description: "The Lidarr post-processor on srvarr has been reporting unsuccessful iterations for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="srvarr",job="node-mtls",file="/var/lib/prometheus-node-exporter-textfile/arr-post-processor-lidarr/arr-post-processor-lidarr.prom"}'
        values: "0x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: LidarrPostProcessorMetricsStale
      - eval_time: 10m30s
        alertname: LidarrPostProcessorMetricsStale
        exp_alerts:
          - exp_labels:
              alertname: LidarrPostProcessorMetricsStale
              category: media
              file: /var/lib/prometheus-node-exporter-textfile/arr-post-processor-lidarr/arr-post-processor-lidarr.prom
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Lidarr post-processor metrics stale on srvarr"
              description: "The Lidarr post-processor metrics file on srvarr has not been refreshed for more than 5 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_lidarr_post_processor_jobs{instance="srvarr",job="node-mtls",state="automation_failed"}'
        values: "1x30 0x2"
    alert_rule_test:
      - eval_time: 14m30s
        alertname: LidarrPostProcessorJobNeedsAttention
      - eval_time: 15m
        alertname: LidarrPostProcessorJobNeedsAttention
        exp_alerts:
          - exp_labels:
              alertname: LidarrPostProcessorJobNeedsAttention
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
              state: automation_failed
            exp_annotations:
              summary: "Lidarr post-processing job needs attention on srvarr"
              description: "At least one Lidarr post-processing job on srvarr has remained failed or its automated resolution failed for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_lidarr_post_processor_jobs{instance="srvarr",job="node-mtls",state="awaiting_manual_match"}'
        values: "1x32"
    alert_rule_test:
      - eval_time: 15m
        alertname: LidarrPostProcessorJobNeedsAttention

  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{instance="srvarr",job="node-mtls",name="arr-post-processor-radarr.service",state="active"}'
        values: "0x10 1x2"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: RadarrMultipartJoinerServiceDown
      - eval_time: 5m
        alertname: RadarrMultipartJoinerServiceDown
        exp_alerts:
          - exp_labels:
              alertname: RadarrMultipartJoinerServiceDown
              category: media
              instance: srvarr
              job: node-mtls
              name: arr-post-processor-radarr.service
              severity: warning
              state: active
            exp_annotations:
              summary: "Radarr multipart joiner service down on srvarr"
              description: "The Radarr multipart joiner service on srvarr has not been active for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_radarr_multipart_joiner_ok{instance="srvarr",job="node-mtls"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: RadarrMultipartJoinerIterationFailed
      - eval_time: 10m
        alertname: RadarrMultipartJoinerIterationFailed
        exp_alerts:
          - exp_labels:
              alertname: RadarrMultipartJoinerIterationFailed
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Radarr multipart joiner failing on srvarr"
              description: "The Radarr multipart joiner on srvarr has been reporting unsuccessful iterations for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="srvarr",job="node-mtls",file="/var/lib/prometheus-node-exporter-textfile/arr-post-processor-radarr/arr-post-processor-radarr.prom"}'
        values: "0x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: RadarrMultipartJoinerMetricsStale
      - eval_time: 10m30s
        alertname: RadarrMultipartJoinerMetricsStale
        exp_alerts:
          - exp_labels:
              alertname: RadarrMultipartJoinerMetricsStale
              category: media
              file: /var/lib/prometheus-node-exporter-textfile/arr-post-processor-radarr/arr-post-processor-radarr.prom
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Radarr multipart joiner metrics stale on srvarr"
              description: "The Radarr multipart joiner metrics file on srvarr has not been refreshed for more than 5 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_radarr_multipart_joiner_jobs{instance="srvarr",job="node-mtls",state="awaiting_manual_match"}'
        values: "1x32"
    alert_rule_test:
      - eval_time: 14m30s
        alertname: RadarrMultipartJoinerJobNeedsAttention
      - eval_time: 15m
        alertname: RadarrMultipartJoinerJobNeedsAttention
        exp_alerts:
          - exp_labels:
              alertname: RadarrMultipartJoinerJobNeedsAttention
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
              state: awaiting_manual_match
            exp_annotations:
              summary: "Radarr multipart join job needs attention on srvarr"
              description: "At least one Radarr multipart join job on srvarr has required manual attention for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_ebook_converter_ok{instance="srvarr",job="node-mtls"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: EbookConverterIterationFailed
      - eval_time: 10m
        alertname: EbookConverterIterationFailed
        exp_alerts:
          - exp_labels:
              alertname: EbookConverterIterationFailed
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Ebook converter failing on srvarr"
              description: "The ebook converter on srvarr has been reporting unsuccessful iterations for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="srvarr",job="node-mtls",file="/var/lib/prometheus-node-exporter-textfile/ebook-converter/ebook-converter.prom"}'
        values: "0x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: EbookConverterMetricsStale
      - eval_time: 10m30s
        alertname: EbookConverterMetricsStale
        exp_alerts:
          - exp_labels:
              alertname: EbookConverterMetricsStale
              category: media
              file: /var/lib/prometheus-node-exporter-textfile/ebook-converter/ebook-converter.prom
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Ebook converter metrics stale on srvarr"
              description: "The ebook converter metrics file on srvarr has not been refreshed for more than 5 minutes."

  - interval: 30s
    input_series:
      - series: 'host_observability_ebook_converter_files{instance="srvarr",job="node-mtls",state="needs_attention"}'
        values: "1x30 0x2"
    alert_rule_test:
      - eval_time: 14m30s
        alertname: EbookConverterFileNeedsAttention
      - eval_time: 15m
        alertname: EbookConverterFileNeedsAttention
        exp_alerts:
          - exp_labels:
              alertname: EbookConverterFileNeedsAttention
              category: media
              instance: srvarr
              job: node-mtls
              severity: warning
              state: needs_attention
            exp_annotations:
              summary: "Ebook conversion needs attention on srvarr"
              description: "At least one ebook conversion on srvarr has remained in need of attention for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'paperless_status_database_status{instance="org",job="paperless"}'
        values: "0x20 1x2"
    alert_rule_test:
      - eval_time: 9m30s
        alertname: PaperlessComponentUnhealthy
      - eval_time: 10m
        alertname: PaperlessComponentUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: PaperlessComponentUnhealthy
              category: service
              component: database
              instance: org
              job: paperless
              severity: warning
            exp_annotations:
              summary: "Paperless component unhealthy: database on org"
              description: "Paperless has reported the database component unhealthy for 10 minutes."

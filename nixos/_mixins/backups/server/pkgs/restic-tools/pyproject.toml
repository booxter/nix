[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "restic-tools"
version = "0.1.0"
description = "Restic backup utilities: cloud offload and B2 usage metrics"
requires-python = ">=3.11"
dependencies = [
  "atomic-file-writes",
  "b2sdk",
  "prometheus-client",
  "pydantic",
]

[project.scripts]
restic-cloud-usage = "restic_tools.cli:main"
restic-cloud-offload = "restic_tools.offload_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restic_tools = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=restic_tools --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/restic_tools"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

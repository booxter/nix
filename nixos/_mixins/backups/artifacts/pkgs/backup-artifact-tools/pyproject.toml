[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-artifact-tools"
version = "0.1.0"
description = "Create consistent database artifacts for host backups"
requires-python = ">=3.11"
dependencies = ["pydantic"]

[project.scripts]
backup-artifact = "backup_artifact_tools.cli:main"

[tool.mypy]
files = ["src/backup_artifact_tools"]
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = "-q --cov=backup_artifact_tools --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

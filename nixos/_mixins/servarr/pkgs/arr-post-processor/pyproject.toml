[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "arr-post-processor"
version = "0.1.0"
description = "Queue-aware post-processing service for Servarr applications"
requires-python = ">=3.13"
dependencies = ["aiohttp", "aiopyarr", "atomic-file-writes", "defusedxml", "hermes-runs", "prometheus-client", "pydantic", "rarfile"]

[tool.mypy]
files = ["src/arr_post_processor"]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["rarfile"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[project.scripts]
arr-post-processor = "arr_post_processor.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=arr_post_processor --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-metrics"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["atomic-file-writes", "prometheus-client", "pydantic"]

[project.scripts]
cake-metrics = "cake_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=cake_metrics --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.mypy]
files = ["src/cake_metrics"]
plugins = ["pydantic.mypy"]
strict = true

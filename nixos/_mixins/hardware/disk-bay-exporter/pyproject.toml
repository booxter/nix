[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-bay-exporter"
version = "0.1.0"
description = "Export physical disk-bay mappings as Prometheus metrics"
requires-python = ">=3.13"
dependencies = ["atomic-file-writes", "prometheus-client", "pydantic"]

[project.scripts]
disk-bay-metrics = "disk_bay_exporter.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disk_bay_exporter = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=disk_bay_exporter --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/disk_bay_exporter"]
plugins = ["pydantic.mypy"]
strict = true

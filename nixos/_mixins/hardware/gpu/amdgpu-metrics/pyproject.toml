[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "amdgpu-metrics"
version = "0.1.0"
description = "Prometheus textfile collector for AMD GPUs"
requires-python = ">=3.13"
dependencies = ["prometheus-client", "pydantic"]

[project.scripts]
amdgpu-metrics = "amdgpu_metrics.amdgpu:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=amdgpu_metrics --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/amdgpu_metrics"]
strict = true

[tool.ruff]
line-length = 100

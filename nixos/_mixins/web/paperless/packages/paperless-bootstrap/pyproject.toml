[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-bootstrap"
version = "0.1.0"
description = "Declarative user and API-token bootstrap for Paperless-ngx"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperless_bootstrap = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=paperless_bootstrap --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/paperless_bootstrap"]
strict = true

[tool.ruff]
line-length = 100

rule_files:
  - ../rules/fleet.rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{instance="beast",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+4.5x13"
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeCpuUsageHigh
      - eval_time: 5m30s
        alertname: NodeCpuUsageHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeCpuUsageHigh
              category: capacity
              instance: beast
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Node CPU usage high on beast"
              description: "beast CPU busy has been above 80% for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{instance="beast",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+1.5x13"
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeCpuUsageCritical
      - eval_time: 5m30s
        alertname: NodeCpuUsageCritical
        exp_alerts:
          - exp_labels:
              alertname: NodeCpuUsageCritical
              category: capacity
              instance: beast
              job: node-mtls
              severity: critical
            exp_annotations:
              summary: "Node CPU usage critical on beast"
              description: "beast CPU busy has been above 90% for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{instance="builder2",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+1.5x13"
      - series: 'node_cpu_seconds_total{instance="frame",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+1.5x13"
      - series: 'node_cpu_seconds_total{instance="mair",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+1.5x13"
      - series: 'node_cpu_seconds_total{instance="mmini",job="node-mtls",cpu="0",mode="idle"}'
        values: "0+1.5x13"
    alert_rule_test:
      - eval_time: 5m30s
        alertname: NodeCpuUsageHigh
      - eval_time: 5m30s
        alertname: NodeCpuUsageCritical

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="beast",job="node-mtls"}'
        values: "15x12"
      - series: 'node_memory_MemTotal_bytes{instance="beast",job="node-mtls"}'
        values: "100x12"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: NodeMemoryUsageHigh
      - eval_time: 5m
        alertname: NodeMemoryUsageHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeMemoryUsageHigh
              category: capacity
              instance: beast
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Node memory usage high on beast"
              description: "beast memory usage has been above 80% for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="beast",job="node-mtls"}'
        values: "5x12"
      - series: 'node_memory_MemTotal_bytes{instance="beast",job="node-mtls"}'
        values: "100x12"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: NodeMemoryUsageCritical
      - eval_time: 5m
        alertname: NodeMemoryUsageCritical
        exp_alerts:
          - exp_labels:
              alertname: NodeMemoryUsageCritical
              category: capacity
              instance: beast
              job: node-mtls
              severity: critical
            exp_annotations:
              summary: "Node memory usage critical on beast"
              description: "beast memory usage has been above 90% for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="mair",job="node-mtls"}'
        values: "5x12"
      - series: 'node_memory_MemTotal_bytes{instance="mair",job="node-mtls"}'
        values: "100x12"
      - series: 'node_memory_MemAvailable_bytes{instance="mmini",job="node-mtls"}'
        values: "5x12"
      - series: 'node_memory_MemTotal_bytes{instance="mmini",job="node-mtls"}'
        values: "100x12"
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeMemoryUsageHigh
      - eval_time: 5m
        alertname: NodeMemoryUsageCritical

  - interval: 30s
    input_series:
      - series: 'node_vmstat_oom_kill{instance="frame",job="node-mtls"}'
        values: "0x10 1x3"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: NodeOOMKillDetected
      - eval_time: 5m
        alertname: NodeOOMKillDetected
      - eval_time: 5m30s
        alertname: NodeOOMKillDetected
        exp_alerts:
          - exp_labels:
              alertname: NodeOOMKillDetected
              category: capacity
              instance: frame
              job: node-mtls
              severity: critical
            exp_annotations:
              summary: "Kernel OOM kill detected on frame"
              description: "The kernel OOM killer terminated at least one process on frame during the last 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_vmstat_oom_kill{instance="beast",job="node-mtls"}'
        values: "0x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeOOMKillDetected

  - interval: 30s
    input_series:
      - series: 'node_pressure_cpu_waiting_seconds_total{instance="builder3",job="node-mtls"}'
        values: "0+28.5x42"
    alert_rule_test:
      - eval_time: 19m30s
        alertname: NodeCPUPressureHigh
      - eval_time: 20m
        alertname: NodeCPUPressureHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeCPUPressureHigh
              category: capacity
              instance: builder3
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "CPU pressure high on builder3"
              description: "CPU pressure has kept at least one task waiting for more than 90% of wall time on builder3 for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'node_pressure_memory_stalled_seconds_total{instance="org",job="node-mtls"}'
        values: "0+6x32"
    alert_rule_test:
      - eval_time: 12m30s
        alertname: NodeMemoryPressureHigh
      - eval_time: 13m
        alertname: NodeMemoryPressureHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeMemoryPressureHigh
              category: capacity
              instance: org
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Memory pressure high on org"
              description: "Memory pressure has stalled all non-idle tasks for more than 10% of wall time on org for 10 minutes."

  - interval: 30s
    input_series:
      - series: 'node_pressure_io_stalled_seconds_total{instance="srvarr",job="node-mtls"}'
        values: "0+18x42"
    alert_rule_test:
      - eval_time: 19m
        alertname: NodeIOPressureHigh
      - eval_time: 19m30s
        alertname: NodeIOPressureHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeIOPressureHigh
              category: capacity
              instance: srvarr
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "I/O pressure high on srvarr"
              description: "I/O pressure has stalled all non-idle tasks for more than 50% of wall time on srvarr for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'node_pressure_cpu_waiting_seconds_total{instance="builder3",job="node-mtls"}'
        values: "0+27x42"
      - series: 'node_pressure_memory_stalled_seconds_total{instance="org",job="node-mtls"}'
        values: "0+3x42"
      - series: 'node_pressure_io_stalled_seconds_total{instance="srvarr",job="node-mtls"}'
        values: "0+15x42"
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeCPUPressureHigh
      - eval_time: 20m
        alertname: NodeMemoryPressureHigh
      - eval_time: 20m
        alertname: NodeIOPressureHigh

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "25769803776x12"
      - series: 'node_memory_MemTotal_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "137438953472x12"
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeMemoryUsageHigh
      - eval_time: 5m
        alertname: ProxmoxNodeMemoryHeadroomLow

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "16106127360x12"
      - series: 'node_memory_MemTotal_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "137438953472x12"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: ProxmoxNodeMemoryHeadroomLow
      - eval_time: 5m
        alertname: ProxmoxNodeMemoryHeadroomLow
        exp_alerts:
          - exp_labels:
              alertname: ProxmoxNodeMemoryHeadroomLow
              category: capacity
              instance: prx1-lab
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "Proxmox node memory headroom low on prx1-lab"
              description: "prx1-lab has less than 16 GiB available or is above 90% memory use for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "7516192768x12"
      - series: 'node_memory_MemTotal_bytes{instance="prx1-lab",job="node-mtls"}'
        values: "137438953472x12"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: ProxmoxNodeMemoryHeadroomCritical
      - eval_time: 5m
        alertname: ProxmoxNodeMemoryHeadroomCritical
        exp_alerts:
          - exp_labels:
              alertname: ProxmoxNodeMemoryHeadroomCritical
              category: capacity
              instance: prx1-lab
              job: node-mtls
              severity: critical
            exp_annotations:
              summary: "Proxmox node memory headroom critical on prx1-lab"
              description: "prx1-lab has less than 8 GiB available or is above 95% memory use for 5 minutes."

  - interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "20x62"
      - series: 'node_filesystem_size_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "100x62"
    alert_rule_test:
      - eval_time: 30m
        alertname: RootFilesystemUsageHigh

  - interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "14x60 20x2"
      - series: 'node_filesystem_size_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "100x62"
    alert_rule_test:
      - eval_time: 29m30s
        alertname: RootFilesystemUsageHigh
      - eval_time: 30m
        alertname: RootFilesystemUsageHigh
        exp_alerts:
          - exp_labels:
              alertname: RootFilesystemUsageHigh
              category: capacity
              fstype: ext4
              instance: builder2
              job: node-mtls
              mountpoint: /
              severity: warning
            exp_annotations:
              summary: "Root filesystem usage high on builder2"
              description: "The root filesystem on builder2 has been above 85% used for 30 minutes."

  - interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "6x32"
      - series: 'node_filesystem_size_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "100x32"
    alert_rule_test:
      - eval_time: 15m
        alertname: RootFilesystemUsageCritical

  - interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "4x30 6x2"
      - series: 'node_filesystem_size_bytes{instance="builder2",job="node-mtls",mountpoint="/",fstype="ext4"}'
        values: "100x32"
    alert_rule_test:
      - eval_time: 14m30s
        alertname: RootFilesystemUsageCritical
      - eval_time: 15m
        alertname: RootFilesystemUsageCritical
        exp_alerts:
          - exp_labels:
              alertname: RootFilesystemUsageCritical
              category: capacity
              fstype: ext4
              instance: builder2
              job: node-mtls
              mountpoint: /
              severity: critical
            exp_annotations:
              summary: "Root filesystem usage critical on builder2"
              description: "The root filesystem on builder2 has been above 95% used for 15 minutes."

  - interval: 30s
    input_series:
      - series: 'node_nixos_upgrade_last_success_time_seconds{instance="beast",job="node-mtls"}'
        values: "86400x4322"
    alert_rule_test:
      - eval_time: 15d
        alertname: HostUpgradeStale

  - interval: 30s
    input_series:
      - series: 'node_nixos_upgrade_last_success_time_seconds{instance="beast",job="node-mtls"}'
        values: "0x46082"
    alert_rule_test:
      - eval_time: 15d
        alertname: HostUpgradeStale
      - eval_time: 15d30s
        alertname: HostUpgradeStale
        exp_alerts:
          - exp_labels:
              alertname: HostUpgradeStale
              category: maintenance
              instance: beast
              job: node-mtls
              severity: warning
            exp_annotations:
              summary: "NixOS upgrades stale on beast"
              description: "beast has not completed a successful NixOS upgrade for more than 14 days."

  - interval: 30s
    input_series:
      - series: 'node_nixos_upgrade_last_success_time_seconds{instance="beast",job="node-mtls"}'
        values: "0x46082"
      - series: 'node_nixos_upgrade_hold_active{instance="beast",job="node-mtls"}'
        values: "1x46082"
    alert_rule_test:
      - eval_time: 15d30s
        alertname: HostUpgradeStale

[package]
name = "reset-oidc"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive", "env"] }
kanidm_client = "=1.10.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
zeroize = "1.8.2"

[package]
name = "kanidm-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.91"
clap = { version = "4.6.0", features = ["derive", "env"] }
kanidm_client = "=1.10.5"
nix = { version = "0.31.2", features = ["fs", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"
zeroize = "1.8.2"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uptimerobot-sync"
version = "0.1.0"
description = "Sync UptimeRobot monitors from Nix service inventory"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic"]

[project.scripts]
uptimerobot-sync = "uptimerobot_sync.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=uptimerobot_sync --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/uptimerobot_sync"]
plugins = ["pydantic.mypy"]
strict = true

[tool.ruff]
line-length = 100

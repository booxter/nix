[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "git-command-runner"
version = "0.1.0"
description = "Typed subprocess runner for internal Git applications"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_command_runner = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=git_command_runner --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/git_command_runner"]
strict = true

[tool.ruff]
line-length = 100

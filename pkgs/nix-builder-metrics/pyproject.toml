[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-builder-metrics"
version = "0.1.0"
description = "Prometheus textfile metrics for active Nix builder slots"
requires-python = ">=3.13"
dependencies = ["atomic-file-writes", "prometheus-client"]

[project.scripts]
nix-builder-metrics = "nix_builder_metrics.cli:main"
nix-builder-cgroup-setup = "nix_builder_metrics.cli:setup_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nix_builder_metrics = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=nix_builder_metrics --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/nix_builder_metrics"]
strict = true

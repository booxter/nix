[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-runs"
version = "0.1.0"
description = "Small command-line client for the Hermes Agent Runs API"
requires-python = ">=3.13"

[project.scripts]
hermes-runs = "hermes_runs.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=hermes_runs --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.mypy]
files = ["src/hermes_runs"]
strict = true
